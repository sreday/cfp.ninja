name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cfpninja_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d cfpninja_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5433/cfpninja_test?sslmode=disable
          DATABASE_AUTO_MIGRATE: "true"
          JWT_SECRET: test-secret-that-is-at-least-32-chars!
          ALLOWED_ORIGINS: http://localhost
          SUBMISSION_LISTING_FEE: "0"
          MAX_PROPOSALS_PER_EVENT: "100"
        run: go test ./tests/integration/...
